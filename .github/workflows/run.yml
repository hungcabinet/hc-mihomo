name: Build
on:
  workflow_dispatch:
    inputs:
      force:
        description: Force build even if this mihomo version was already built
        type: boolean
        default: false
  schedule:
    - cron: "00 23 * * *"
  push:
    branches:
      - master
      - hidden
    paths-ignore:
      - "**/README.md"
      - "**/template.yaml"

permissions:
  contents: write
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 3
          keep_minimum_runs: 6

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: freebsd, goarch: riscv64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: 386 }
          - { goos: freebsd, goarch: arm, goarm: 6 }
          - { goos: freebsd, goarch: arm, goarm: 7 }
          - { goos: freebsd, goarch: arm64 }
    outputs:
      NEW: ${{ steps.check.outputs.NEW }}
      BUILD: ${{ steps.check.outputs.BUILD }}
      VERSION: ${{ steps.check.outputs.VERSION }}

    steps:
      - name: Checkout the "hidden" branch
        uses: actions/checkout@v6
        with:
          ref: hidden

      - name: Calculate latest version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          LATEST_VERSION=$(printf '%s' "${RESPONSE}" | jq -r '.tag_name // empty' | sed 's|^v||')
          if [ -z "${LATEST_VERSION}" ] || [ "${LATEST_VERSION}" = "null" ]; then
            echo "Failed to resolve latest mihomo release tag"
            printf '%s\n' "${RESPONSE}" | head -c 2000
            exit 1
          fi
          echo "Resolved mihomo version: ${LATEST_VERSION}"
          echo "RELEASE_NAME=${LATEST_VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=v${LATEST_VERSION}" >> $GITHUB_ENV
          echo "TAGS=with_gvisor" >> $GITHUB_ENV
          echo "VERSION=${LATEST_VERSION}" >> $GITHUB_ENV
        shell: bash

      - name: Check for new version
        id: check
        run: |
          if [ -f last_version ]; then
            LAST_VERSION=$(cat last_version)
          else
            LAST_VERSION="none"
          fi
          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE=true
          fi
          echo "Last version: ${LAST_VERSION}, current version: ${{ env.VERSION }}, force: ${FORCE}"

          NEW=false
          BUILD=false
          if [ "${{ env.VERSION }}" != "${LAST_VERSION}" ]; then
            NEW=true
            BUILD=true
          elif [ "${FORCE}" = "true" ]; then
            BUILD=true
          fi

          echo "NEW=${NEW}" >> $GITHUB_ENV
          echo "NEW=${NEW}" >> $GITHUB_OUTPUT
          echo "BUILD=${BUILD}" >> $GITHUB_ENV
          echo "BUILD=${BUILD}" >> $GITHUB_OUTPUT
          echo "VERSION=${{ env.VERSION }}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Download and extract source tarball files
        if: env.BUILD == 'true' || github.event_name == 'push'
        run: |
          wget https://github.com/MetaCubeX/mihomo/archive/refs/tags/v${{ env.VERSION }}.tar.gz -O mihomo-${{ env.VERSION }}.tar.gz
          tar -xf mihomo-${{ env.VERSION }}.tar.gz && mv mihomo-${{ env.VERSION }} mihomo
          cd mihomo
          SING_TUN_VERSION=$(cat go.mod | grep github.com/metacubex/sing-tun | awk '{ print $2 }' | sed 's|v||g')
          echo -e "\nreplace github.com/metacubex/sing-tun v${SING_TUN_VERSION} => ../sing-tun" >> go.mod
          echo -e "sing-tun version: ${SING_TUN_VERSION}"
          cd ..
          wget https://github.com/MetaCubeX/sing-tun/archive/refs/tags/v${SING_TUN_VERSION}.tar.gz -O sing-tun-${SING_TUN_VERSION}.tar.gz
          tar -xf sing-tun-${SING_TUN_VERSION}.tar.gz && mv sing-tun-${SING_TUN_VERSION} sing-tun
          ls -lha

      - name: Apply patches
        if: env.BUILD == 'true' || github.event_name == 'push'
        run: |
          cd mihomo
          cp component/memory/memory_freebsd_amd64.go component/memory/memory_freebsd_riscv64.go
          patch -p1 < ../mihomo.patch
          cd ../sing-tun
          patch -p1 < ../sing-tun.patch
          cp monitor_darwin.go monitor_freebsd.go

      - name: Setup go
        if: env.BUILD == 'true' || github.event_name == 'push'
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Cache go dependencies
        if: env.BUILD == 'true' || github.event_name == 'push'
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}

      - name: Cache go build (not arm)
        if: matrix.goarch != 'arm' && (env.BUILD == 'true' || github.event_name == 'push')
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
          key: go-${{ hashFiles('**/go.sum') }}-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Cache go build (arm)
        if: matrix.goarch == 'arm' && (env.BUILD == 'true' || github.event_name == 'push')
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
          key: go-${{ hashFiles('**/go.sum') }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.goarm }}

      - name: Build and compress binary file
        if: env.BUILD == 'true' || github.event_name == 'push'
        run: |
          cd mihomo
          go build -v -tags ${{ env.TAGS }} -trimpath -ldflags '-X "github.com/metacubex/mihomo/constant.Version=${{ env.RELEASE_NAME }}" -X "github.com/metacubex/mihomo/constant.BuildTime=none" -w -s -buildid=' -o mihomo
          if [ "${{ matrix.goarch }}" == 'arm' ]; then
            mv mihomo clash-meta-${{ matrix.goos }}-${{ matrix.goarch }}v${{ matrix.goarm }}
            xz -v clash-meta-${{ matrix.goos }}-${{ matrix.goarch }}v${{ matrix.goarm }}
          else
            mv mihomo clash-meta-${{ matrix.goos }}-${{ matrix.goarch }}
            xz -v clash-meta-${{ matrix.goos }}-${{ matrix.goarch }}
          fi
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0

      - name: Move file to publish directory
        if: env.BUILD == 'true' || github.event_name == 'push'
        run: |
          mkdir -p publish
          cp -v mihomo/clash-meta-* publish/

      - name: Upload build artifact
        if: env.BUILD == 'true' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: clash-meta-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: publish/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.BUILD == 'true' || github.event_name == 'push'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: publish
          pattern: clash-meta-*
          merge-multiple: true

      - name: List release files
        run: ls -lah publish

      - name: Delete existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.build.outputs.VERSION }}"
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Deleting existing release ${TAG} so it can be recreated as latest"
            gh release delete "${TAG}" --repo "${{ github.repository }}" --yes
          else
            echo "No existing release for ${TAG}"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.build.outputs.VERSION }}
          tag_name: v${{ needs.build.outputs.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push:
    runs-on: ubuntu-latest
    if: needs.build.outputs.NEW == 'true'
    needs:
      - build
      - release
    steps:
      - name: Checkout the "hidden" branch
        uses: actions/checkout@v6
        with:
          ref: hidden

      - name: Update last_version
        run: |
          echo "${{ needs.build.outputs.VERSION }}" > last_version

      - name: Push last_version to "hidden" branch
        run: |
          git config --local user.name "Vincent Loeng"
          git config --local user.email "173226116+Vincent-Loeng@users.noreply.github.com"
          git add last_version
          git commit -m "Release ${{ needs.build.outputs.VERSION }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
